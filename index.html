<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager — Manajemen Tugas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue-50: #E6F1FB;
    --blue-100: #B5D4F4;
    --blue-200: #85B7EB;
    --blue-400: #378ADD;
    --blue-600: #185FA5;
    --blue-800: #0C447C;
    --blue-900: #042C53;
    --white: #ffffff;
    --gray-50: #F8FAFC;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-400: #94A3B8;
    --gray-600: #64748B;
    --gray-800: #1E293B;
    --red-100: #FEE2E2;
    --red-600: #DC2626;
    --amber-100: #FEF3C7;
    --amber-600: #D97706;
    --green-100: #DCFCE7;
    --green-600: #16A34A;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 16px rgba(15,35,75,0.10);
    --shadow-lg: 0 8px 32px rgba(15,35,75,0.14);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #F0F6FF;
    color: var(--gray-800);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* AUTH SCREEN */
  .auth-screen {
    position: fixed; inset: 0;
    background: var(--blue-900);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; 
    transition: opacity 0.3s;
  }
  .auth-screen.hidden {
    opacity: 0; pointer-events: none;
  }
  .auth-card {
    background: white;
    padding: 40px 32px;
    border-radius: 16px;
    width: 100%; max-width: 400px;
    box-shadow: var(--shadow-lg);
  }

  /* SIDEBAR */
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 260px;
    background: var(--blue-900);
    display: flex; flex-direction: column;
    padding: 0;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .sidebar-brand {
    padding: 28px 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .brand-logo {
    display: flex; align-items: center; gap: 10px;
  }

  .brand-icon {
    width: 36px; height: 36px;
    background: var(--blue-400);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }

  .brand-icon svg { width: 20px; height: 20px; fill: white; }

  .brand-name {
    font-size: 20px; font-weight: 700;
    color: white;
    letter-spacing: -0.3px;
  }

  .brand-tagline {
    font-size: 11px; color: rgba(255,255,255,0.45);
    margin-top: 2px; margin-left: 46px;
    letter-spacing: 0.5px;
  }

  .sidebar-stats {
    padding: 20px 24px;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .stat-chip {
    background: rgba(255,255,255,0.07);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    text-align: center;
  }

  .stat-chip .num {
    font-size: 22px; font-weight: 700; color: white; display: block;
  }

  .stat-chip .lbl {
    font-size: 10px; color: rgba(255,255,255,0.45);
    text-transform: uppercase; letter-spacing: 0.8px;
  }

  .sidebar-nav {
    padding: 16px 12px;
    flex: 1;
  }

  .nav-label {
    font-size: 10px; font-weight: 600;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase; letter-spacing: 1px;
    padding: 0 12px; margin-bottom: 8px;
  }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    color: rgba(255,255,255,0.6);
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    border: none; background: none; width: 100%; text-align: left;
    margin-bottom: 2px;
  }

  .nav-item:hover { background: rgba(255,255,255,0.07); color: white; }
  .nav-item.active { background: var(--blue-600); color: white; }

  .nav-item .count-badge {
    margin-left: auto;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 11px; font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .nav-item.active .count-badge { background: rgba(255,255,255,0.25); }

  .nav-icon {
    width: 18px; height: 18px; flex-shrink: 0;
  }

  /* MAIN */
  .main {
    margin-left: 260px;
    min-height: 100vh;
    display: flex; flex-direction: column;
    transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body.sidebar-collapsed .sidebar { transform: translateX(-100%); }
  body.sidebar-collapsed .main { margin-left: 0; }

  /* TOPBAR */
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    padding: 16px 32px;
    display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 50;
  }

  .menu-toggle {
    background: transparent;
    border: none;
    color: #000000;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  
  .menu-toggle:hover { background: var(--gray-100); }
  .menu-toggle svg { width: 24px; height: 24px; display: block; }

  .topbar-title {
    font-size: 18px; font-weight: 700; color: var(--blue-900);
    flex: 1;
  }

  .search-wrap {
    position: relative; flex: 1; max-width: 320px;
  }

  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--gray-400);
  }

  .search-input {
    width: 100%; padding: 9px 12px 9px 36px;
    border: 1.5px solid var(--gray-200); border-radius: 100px;
    font-size: 13px; font-family: inherit;
    outline: none; background: var(--gray-50);
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: var(--blue-400); background: white; }

  .btn-add {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px; background: var(--blue-600); color: white;
    border: none; border-radius: 100px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; font-family: inherit;
  }
  .btn-add:hover { background: var(--blue-800); transform: translateY(-1px); box-shadow: var(--shadow-md); }

  .btn-logout {
    padding: 10px 20px; border-radius: 100px;
    border: 1.5px solid var(--red-600); background: white;
    color: var(--red-600); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.12s; font-family: inherit;
  }
  .btn-logout:hover { background: var(--red-100); }

  /* CONTENT */
  .content { padding: 28px 32px; flex: 1; }

  /* FILTERS */
  .filters { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-btn {
    padding: 7px 16px; border-radius: 100px;
    font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1.5px solid var(--gray-200);
    background: white; color: var(--gray-600);
    transition: all 0.15s; font-family: inherit;
  }
  .filter-btn:hover { border-color: var(--blue-400); color: var(--blue-600); }
  .filter-btn.active { background: var(--blue-600); color: white; border-color: var(--blue-600); }

  /* KANBAN */
  .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .column { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); overflow: hidden; }
  .column-header { padding: 16px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--gray-100); }
  
  .col-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .col-dot.todo { background: var(--gray-400); }
  .col-dot.inprogress { background: var(--blue-400); }
  .col-dot.done { background: var(--green-600); }

  .col-title { font-size: 14px; font-weight: 700; color: var(--gray-800); flex: 1; }
  .col-count { font-size: 12px; font-weight: 600; background: var(--gray-100); color: var(--gray-600); padding: 2px 8px; border-radius: 20px; }
  .column-body { padding: 12px; min-height: 280px; display: flex; flex-direction: column; gap: 10px; }

  /* TASK CARD */
  .task-card {
    background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
    padding: 14px 16px; cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow-sm);
    position: relative; overflow: hidden;
  }
  .task-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px 0 0 3px;
  }
  .task-card.priority-high::before { background: var(--red-600); }
  .task-card.priority-medium::before { background: var(--amber-600); }
  .task-card.priority-low::before { background: var(--green-600); }
  .task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--blue-200); }

  .task-title { font-size: 14px; font-weight: 600; color: var(--gray-800); margin-bottom: 6px; line-height: 1.4; }
  .task-desc {
    font-size: 12px; color: var(--gray-600); line-height: 1.5; margin-bottom: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
  .tag.priority-high { background: var(--red-100); color: var(--red-600); }
  .tag.priority-medium { background: var(--amber-100); color: var(--amber-600); }
  .tag.priority-low { background: var(--green-100); color: var(--green-600); }
  .deadline-badge { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; margin-left: auto; }
  .deadline-badge svg { width: 11px; height: 11px; }
  .deadline-badge.overdue { background: var(--red-100); color: var(--red-600); }
  .deadline-badge.soon { background: var(--amber-100); color: var(--amber-600); }
  .deadline-badge.normal { background: var(--blue-50); color: var(--blue-600); }
  .task-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--gray-100); }
  
  .action-btn {
    flex: 1; padding: 6px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
    background: var(--gray-50); color: var(--gray-600); font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.12s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .action-btn:hover { background: var(--blue-50); color: var(--blue-600); border-color: var(--blue-200); }
  .action-btn.danger:hover { background: var(--red-100); color: var(--red-600); border-color: #FCA5A5; }

  .empty-col { text-align: center; padding: 32px 16px; color: var(--gray-400); font-size: 13px; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(4, 44, 83, 0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 20px;
  }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal {
    background: white; border-radius: 16px; width: 100%; max-width: 520px;
    box-shadow: var(--shadow-lg); transform: translateY(12px) scale(0.98);
    transition: transform 0.22s; overflow: hidden;
  }
  .modal-overlay.show .modal { transform: translateY(0) scale(1); }
  .modal-header { background: var(--blue-900); padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  .modal-header h2 { font-size: 17px; font-weight: 700; color: white; flex: 1; }
  .modal-close { background: rgba(255,255,255,0.12); border: none; border-radius: 8px; color: white; cursor: pointer; padding: 6px; display: flex; transition: background 0.12s; }
  .modal-close:hover { background: rgba(255,255,255,0.22); }
  .modal-body { padding: 24px; }
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-800); margin-bottom: 6px; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
    font-size: 14px; font-family: inherit; color: var(--gray-800); background: var(--gray-50);
    outline: none; transition: border-color 0.15s, background 0.15s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--blue-400); background: white; }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--gray-100); display: flex; gap: 10px; justify-content: flex-end; }
  
  .btn-cancel {
    padding: 10px 20px; border-radius: var(--radius-sm); border: 1.5px solid var(--gray-200); background: white;
    color: var(--gray-600); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.12s; font-family: inherit;
  }
  .btn-cancel:hover { background: var(--gray-100); }
  .btn-save {
    padding: 10px 24px; border-radius: var(--radius-sm); border: none; background: var(--blue-600);
    color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.12s; font-family: inherit;
  }
  .btn-save:hover { background: var(--blue-800); }

  /* TOAST */
  .toast-wrap { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; }
  .toast {
    display: flex; align-items: center; gap: 10px; background: var(--blue-900); color: white;
    padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-lg); animation: slideUp 0.2s ease;
  }
  .toast.success { background: #14532D; }
  .toast.error { background: #7F1D1D; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* PROGRESS BAR */
  .progress-section {
    background: white; border-radius: var(--radius); border: 1px solid var(--gray-200);
    padding: 20px 24px; margin-bottom: 24px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
  }
  .progress-label { font-size: 13px; color: var(--gray-600); margin-bottom: 8px; }
  .progress-bar-wrap { background: var(--gray-100); border-radius: 100px; height: 8px; }
  .progress-bar { height: 8px; border-radius: 100px; background: linear-gradient(90deg, var(--blue-400), var(--blue-600)); transition: width 0.4s ease; }
  .progress-pct { font-size: 28px; font-weight: 700; color: var(--blue-900); text-align: right; }
  .progress-pct span { font-size: 13px; color: var(--gray-400); font-weight: 400; }

  /* LIST VIEW */
  .list-view { display: none; }
  .list-view.active { display: flex; flex-direction: column; gap: 10px; }
  .list-card {
    background: white; border-radius: var(--radius-sm); border: 1px solid var(--gray-200);
    padding: 14px 18px; display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 14px; align-items: center;
    box-shadow: var(--shadow-sm); transition: all 0.12s;
  }
  .list-card:hover { transform: translateX(3px); border-color: var(--blue-200); }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.todo { background: var(--gray-400); }
  .status-dot.inprogress { background: var(--blue-400); }
  .status-dot.done { background: var(--green-600); }
  .list-title { font-size: 14px; font-weight: 600; color: var(--gray-800); }
  .list-desc { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

  /* VIEW TOGGLE */
  .view-toggle { display: flex; gap: 6px; }
  .view-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1.5px solid var(--gray-200);
    background: white; color: var(--gray-400); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s;
  }
  .view-btn:hover { border-color: var(--blue-300); color: var(--blue-600); }
  .view-btn.active { background: var(--blue-600); color: white; border-color: var(--blue-600); }

  @media (max-width: 900px) {
    .sidebar { width: 200px; }
    .main { margin-left: 200px; }
    body.sidebar-collapsed .sidebar { transform: translateX(-100%); }
    body.sidebar-collapsed .main { margin-left: 0; }
    .kanban { grid-template-columns: 1fr; }
    .content { padding: 20px 16px; }
    .topbar { padding: 14px 16px; }
  }
</style>
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="brand-logo" style="justify-content: center; margin-bottom: 24px;">
      <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
      <div class="brand-name" style="color: var(--blue-900);">Task Manager</div>
    </div>
    <h2 id="auth-title" style="text-align: center; margin-bottom: 20px;">Masuk ke Akun</h2>
    
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-input" type="text" id="auth-username" placeholder="Masukkan username...">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="auth-password" placeholder="Masukkan password...">
    </div>
    
    <button class="btn-save" style="width: 100%; margin-top: 10px;" onclick="handleAuth()" id="auth-btn">Masuk</button>
    
    <p style="text-align: center; margin-top: 16px; font-size: 13px;">
      <span id="auth-switch-text">Belum punya akun?</span> 
      <a href="#" style="color: var(--blue-600); font-weight: bold; text-decoration: none;" onclick="toggleAuthMode()">Daftar di sini</a>
    </p>
  </div>
</div>

<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      </div>
      <div class="brand-name">Task Manager</div>
    </div>
    <div class="brand-tagline">Manajemen Tugas Guwe</div>
  </div>

  <div class="sidebar-stats">
    <div class="stat-chip"><span class="num" id="stat-total">0</span><span class="lbl">Total</span></div>
    <div class="stat-chip"><span class="num" id="stat-done">0</span><span class="lbl">Selesai</span></div>
    <div class="stat-chip"><span class="num" id="stat-overdue">0</span><span class="lbl">Terlambat</span></div>
    <div class="stat-chip"><span class="num" id="stat-today">0</span><span class="lbl">Hari Ini</span></div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-label">Filter</div>
    <button class="nav-item active" onclick="setFilter('all', this)">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Semua Tugas <span class="count-badge" id="nav-all">0</span>
    </button>
    <button class="nav-item" onclick="setFilter('todo', this)">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Belum Dikerjakan <span class="count-badge" id="nav-todo">0</span>
    </button>
    <button class="nav-item" onclick="setFilter('inprogress', this)">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Dalam Proses <span class="count-badge" id="nav-inprogress">0</span>
    </button>
    <button class="nav-item" onclick="setFilter('done', this)">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Selesai <span class="count-badge" id="nav-done">0</span>
    </button>
    <button class="nav-item" onclick="setFilter('overdue', this)">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Terlambat <span class="count-badge" id="nav-overdue">0</span>
    </button>
  </nav>
</aside>

<main class="main">
  <div class="topbar">
    <button class="menu-toggle" onclick="toggleSidebar()" title="Sembunyikan/Tampilkan Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    
    <div class="topbar-title" id="page-title">Semua Tugas</div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" placeholder="Cari tugas..." oninput="renderAll()" id="search-input">
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="vbtn-kanban" title="Kanban" onclick="setView('kanban')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="14"/><rect x="14" y="3" width="7" height="9"/></svg>
      </button>
      <button class="view-btn" id="vbtn-list" title="List" onclick="setView('list')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
    </div>
    <button class="btn-add" onclick="openModal()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Tambah Tugas
    </button>
    <button class="btn-logout" onclick="logout()" title="Keluar dari Akun">
      Keluar
    </button>
  </div>

  <div class="content">
    <div class="progress-section">
      <div>
        <div class="progress-label">Progress Keseluruhan</div>
        <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
      </div>
      <div class="progress-pct" id="prog-pct">0<span>%</span></div>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setPriority('all', this)">Semua Prioritas</button>
      <button class="filter-btn" onclick="setPriority('high', this)">🔴 Tinggi</button>
      <button class="filter-btn" onclick="setPriority('medium', this)">🟡 Sedang</button>
      <button class="filter-btn" onclick="setPriority('low', this)">🟢 Rendah</button>
    </div>

    <div class="kanban" id="kanban-view">
      <div class="column">
        <div class="column-header"><div class="col-dot todo"></div><div class="col-title">Belum Dikerjakan</div><div class="col-count" id="col-todo-count">0</div></div>
        <div class="column-body" id="col-todo"></div>
      </div>
      <div class="column">
        <div class="column-header"><div class="col-dot inprogress"></div><div class="col-title">Dalam Proses</div><div class="col-count" id="col-inprogress-count">0</div></div>
        <div class="column-body" id="col-inprogress"></div>
      </div>
      <div class="column">
        <div class="column-header"><div class="col-dot done"></div><div class="col-title">Selesai</div><div class="col-count" id="col-done-count">0</div></div>
        <div class="column-body" id="col-done"></div>
      </div>
    </div>
    <div class="list-view" id="list-view"></div>
  </div>
</main>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      <h2 id="modal-title">Tambah Tugas Baru</h2>
      <button class="modal-close" onclick="closeModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="form-group"><label class="form-label">Judul Tugas *</label><input class="form-input" type="text" id="f-title" placeholder="Masukkan judul tugas..."></div>
      <div class="form-group"><label class="form-label">Deskripsi</label><textarea class="form-textarea" id="f-desc" placeholder="Detail tugas..."></textarea></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="f-status"><option value="todo">Belum Dikerjakan</option><option value="inprogress">Dalam Proses</option><option value="done">Selesai</option></select></div>
        <div class="form-group"><label class="form-label">Prioritas</label><select class="form-select" id="f-priority"><option value="low">Rendah</option><option value="medium">Sedang</option><option value="high">Tinggi</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Deadline</label><input class="form-input" type="date" id="f-deadline"></div>
        <div class="form-group"><label class="form-label">Kategori</label><input class="form-input" type="text" id="f-category" placeholder="Contoh: Kuliah, Kerja..."></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn-save" onclick="saveTask()">Simpan Tugas</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
let tasks = [];
let currentFilter = 'all';
let currentPriority = 'all';
let currentView = 'kanban';
let editingId = null;

const API_URL = 'https://task-flow-backend-orcin.vercel.app/api/tasks';
let isLoginMode = true;

// --- SISTEM AUTENTIKASI ---
function checkAuth() {
  const token = localStorage.getItem('task_token');
  if (token) {
    document.getElementById('auth-screen').classList.add('hidden');
    fetchTasks();
  } else {
    document.getElementById('auth-screen').classList.remove('hidden');
  }
}

function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  document.getElementById('auth-title').textContent = isLoginMode ? 'Masuk ke Akun' : 'Daftar Akun Baru';
  document.getElementById('auth-btn').textContent = isLoginMode ? 'Masuk' : 'Daftar';
  document.getElementById('auth-switch-text').textContent = isLoginMode ? 'Belum punya akun?' : 'Sudah punya akun?';
  document.querySelector('#auth-switch-text + a').textContent = isLoginMode ? 'Daftar di sini' : 'Masuk di sini';
}

async function handleAuth() {
  const user = document.getElementById('auth-username').value.trim();
  const pass = document.getElementById('auth-password').value.trim();
  
  if (!user || !pass) return toast('Username dan password wajib diisi!', 'error');

  const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
  
  try {
    const res = await fetch(API_BASE + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Terjadi kesalahan');
    
    if (isLoginMode) {
      localStorage.setItem('task_token', data.token);
      toast('Login berhasil!', 'success');
      document.getElementById('auth-username').value = '';
      document.getElementById('auth-password').value = '';
      checkAuth();
    } else {
      toast('Registrasi berhasil! Silakan masuk.', 'success');
      toggleAuthMode();
    }
  } catch (error) {
    toast(error.message, 'error');
  }
}

function logout() {
  localStorage.removeItem('task_token');
  tasks = [];
  renderAll();
  checkAuth();
  toast('Berhasil keluar', 'success');
}

function getHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + localStorage.getItem('task_token')
  };
}

// --- FUNGSI UTAMA ---
function toggleSidebar() { document.body.classList.toggle('sidebar-collapsed'); }

async function fetchTasks() {
  try {
    const res = await fetch(`${API_BASE}/tasks`, { headers: getHeaders() });
    if (res.status === 401 || res.status === 403) return logout();
    tasks = await res.json();
    tasks = tasks.map(t => ({...t, desc: t.description})); 
    renderAll();
  } catch (error) { toast('Gagal terhubung ke server', 'error'); }
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function today() { return new Date().toISOString().slice(0, 10); }

function deadlineStatus(dl) {
  if (!dl) return null;
  const dlDate = dl.split('T')[0];
  if (dlDate < today()) return 'overdue';
  if ((new Date(dlDate) - new Date(today())) / 86400000 <= 3) return 'soon';
  return 'normal';
}

function formatDate(dl) {
  if (!dl) return '';
  return new Date(dl.split('T')[0] + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}

function makeCard(t) {
  const ds = deadlineStatus(t.deadline);
  return `
    <div class="task-card priority-${t.priority}" onclick="openEdit('${t.id}')">
      <div class="task-title">${esc(t.title)}</div>
      ${t.desc ? `<div class="task-desc">${esc(t.desc)}</div>` : ''}
      <div class="task-meta">
        <span class="tag priority-${t.priority}">${{high:'Tinggi',medium:'Sedang',low:'Rendah'}[t.priority]}</span>
        ${t.category ? `<span class="tag" style="background:#EFF6FF;color:#1D4ED8">${esc(t.category)}</span>` : ''}
        ${t.deadline ? `<span class="deadline-badge ${ds||'normal'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${formatDate(t.deadline)}</span>` : ''}
      </div>
      <div class="task-actions" onclick="event.stopPropagation()">
        ${t.status !== 'todo' ? `<button class="action-btn" onclick="moveTask('${t.id}', 'prev')">◀ Mundur</button>` : ''}
        ${t.status !== 'done' ? `<button class="action-btn" onclick="moveTask('${t.id}', 'next')">Maju ▶</button>` : ''}
        <button class="action-btn danger" onclick="deleteTask('${t.id}')">🗑</button>
      </div>
    </div>`;
}

function makeListRow(t) {
  const ds = deadlineStatus(t.deadline);
  return `
    <div class="list-card">
      <div class="status-dot ${t.status}"></div>
      <div><div class="list-title">${esc(t.title)}</div>${t.desc ? `<div class="list-desc">${esc(t.desc)}</div>` : ''}</div>
      <span class="tag priority-${t.priority}">${{high:'Tinggi',medium:'Sedang',low:'Rendah'}[t.priority]}</span>
      ${t.deadline ? `<span class="deadline-badge ${ds||'normal'}">${formatDate(t.deadline)}</span>` : '<span></span>'}
      <div style="display:flex;gap:6px"><button class="action-btn" onclick="openEdit('${t.id}')">✏️</button><button class="action-btn danger" onclick="deleteTask('${t.id}')">🗑</button></div>
    </div>`;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderAll() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = tasks.filter(t => {
    const mf = currentFilter === 'all' || t.status === currentFilter || (currentFilter === 'overdue' && deadlineStatus(t.deadline) === 'overdue' && t.status !== 'done');
    const mp = currentPriority === 'all' || t.priority === currentPriority;
    const ms = !q || t.title.toLowerCase().includes(q) || (t.desc||'').toLowerCase().includes(q) || (t.category||'').toLowerCase().includes(q);
    return mf && mp && ms;
  });

  const bs = { todo: [], inprogress: [], done: [] };
  filtered.forEach(t => (bs[t.status] || bs.todo).push(t));

  ['todo','inprogress','done'].forEach(s => {
    document.getElementById('col-' + s).innerHTML = bs[s].length ? bs[s].map(makeCard).join('') : `<div class="empty-col">Tidak ada tugas</div>`;
    document.getElementById('col-' + s + '-count').textContent = bs[s].length;
  });

  document.getElementById('list-view').innerHTML = filtered.length ? filtered.map(makeListRow).join('') : '<div style="text-align:center;padding:40px;color:#94A3B8">Tidak ada tugas ditemukan</div>';

  const tot = tasks.length, done = tasks.filter(t => t.status === 'done').length, ov = tasks.filter(t => deadlineStatus(t.deadline) === 'overdue' && t.status !== 'done').length;
  document.getElementById('stat-total').textContent = tot;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-overdue').textContent = ov;
  document.getElementById('stat-today').textContent = tasks.filter(t => t.deadline && t.deadline.split('T')[0] === today()).length;

  const pct = tot ? Math.round(done / tot * 100) : 0;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-pct').innerHTML = pct + '<span>%</span>';

  document.getElementById('nav-all').textContent = tot;
  document.getElementById('nav-todo').textContent = tasks.filter(t => t.status === 'todo').length;
  document.getElementById('nav-inprogress').textContent = tasks.filter(t => t.status === 'inprogress').length;
  document.getElementById('nav-done').textContent = done;
  document.getElementById('nav-overdue').textContent = ov;
}

function openModal(id) {
  editingId = id || null;
  const t = tasks.find(x => x.id === id);
  document.getElementById('modal-title').textContent = t ? 'Edit Tugas' : 'Tambah Tugas Baru';
  document.getElementById('f-title').value = t ? t.title : '';
  document.getElementById('f-desc').value = t ? (t.desc || '') : '';
  document.getElementById('f-status').value = t ? t.status : 'todo';
  document.getElementById('f-priority').value = t ? t.priority : 'medium';
  document.getElementById('f-deadline').value = (t && t.deadline) ? t.deadline.split('T')[0] : '';
  document.getElementById('f-category').value = t ? (t.category || '') : '';
  document.getElementById('modal-overlay').classList.add('show');
}
function openEdit(id) { openModal(id); }
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('show');
  editingId = null;
}

async function saveTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) return toast('Judul tugas wajib diisi!', 'error');
  
  const data = {
    title, desc: document.getElementById('f-desc').value.trim(),
    status: document.getElementById('f-status').value, priority: document.getElementById('f-priority').value,
    deadline: document.getElementById('f-deadline').value || null, category: document.getElementById('f-category').value.trim(),
    updatedAt: new Date().toISOString()
  };

  try {
    if (editingId) {
      await fetch(`${API_BASE}/tasks/${editingId}`, { method: 'PUT', headers: getHeaders(), body: JSON.stringify(data) });
      toast('Tugas berhasil diperbarui ✓', 'success');
    } else {
      data.id = genId(); data.createdAt = new Date().toISOString();
      await fetch(`${API_BASE}/tasks`, { method: 'POST', headers: getHeaders(), body: JSON.stringify(data) });
      toast('Tugas berhasil ditambahkan ✓', 'success');
    }
    closeModal(); fetchTasks();
  } catch (error) { toast('Gagal menyimpan tugas', 'error'); }
}

async function deleteTask(id) {
  if (!confirm('Yakin ingin menghapus tugas ini?')) return;
  try {
    await fetch(`${API_BASE}/tasks/${id}`, { method: 'DELETE', headers: getHeaders() });
    toast('Tugas dihapus', 'success');
    fetchTasks();
  } catch (error) { toast('Gagal menghapus tugas', 'error'); }
}

async function moveTask(id, dir) {
  const order = ['todo','inprogress','done'], t = tasks.find(x => x.id === id);
  if (!t) return;
  
  let ns = t.status; const idx = order.indexOf(t.status);
  if (dir === 'next' && idx < 2) ns = order[idx + 1];
  if (dir === 'prev' && idx > 0) ns = order[idx - 1];
  
  try {
    await fetch(`${API_BASE}/tasks/${id}`, { method: 'PUT', headers: getHeaders(), body: JSON.stringify({ ...t, status: ns, updatedAt: new Date().toISOString() }) });
    toast('Status tugas diperbarui ✓', 'success'); fetchTasks();
  } catch (error) { toast('Gagal memindahkan tugas', 'error'); }
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); el.classList.add('active');
  document.getElementById('page-title').textContent = { all: 'Semua Tugas', todo: 'Belum Dikerjakan', inprogress: 'Dalam Proses', done: 'Selesai', overdue: 'Tugas Terlambat' }[f] || 'Tugas';
  renderAll();
}
function setPriority(p, el) { currentPriority = p; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); renderAll(); }
function setView(v) {
  currentView = v; document.getElementById('kanban-view').style.display = v === 'kanban' ? 'grid' : 'none';
  document.getElementById('list-view').classList.toggle('active', v === 'list');
  document.getElementById('vbtn-kanban').classList.toggle('active', v === 'kanban'); document.getElementById('vbtn-list').classList.toggle('active', v === 'list');
}

function toast(msg, type = '') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// Inisialisasi awal aplikasi
checkAuth();
</script>
</body>
</html>
